# NeoAMS — production stack with Traefik.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d
#
# The API and the web app are behind Traefik, so they share an origin and
# the session cookie works without any cross-site allowances.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DB_FILE_NAME: /data/neoams.sqlite
      UPLOAD_DIR: /data/uploads
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      FRONTEND_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      PORT: "3000"
      TRUST_PROXY: "true"
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_SIGN_IN_MAX: ${RATE_LIMIT_SIGN_IN_MAX:-10}
    volumes:
      - neoams-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=neoams-network"
      - "traefik.http.routers.api.rule=PathPrefix(`/api/`) || PathPrefix(`/uploads/`) || PathPrefix(`/reference`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=api-headers"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.services.api.loadbalancer.passhostheader=true"
      # Middleware for API headers
      - "traefik.http.middlewares.api-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.api-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.api-headers.headers.customresponseheaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.api-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/setup/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      ORIGIN: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      PORT: "3000"
      HOST: 0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=neoams-network"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.service=web"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=web-headers"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      - "traefik.http.services.web.loadbalancer.passhostheader=true"
      # Middleware for web headers
      - "traefik.http.middlewares.web-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.web-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.web-headers.headers.customresponseheaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.web-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    user: root
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    command:
      - "--global.checkNewVersion=true"
      - "--global.sendAnonymousUsage=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--api.dashboard=true"
      - "--api.debug=false"
      - "--api.insecure=false"
      - "--providers.file.filename=/etc/traefik/traefik.json"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik.json:/etc/traefik/traefik.json:ro
      - letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH:-}"

volumes:
  # The SQLite database and the uploaded images.
  neoams-data:
  # The certificates Traefik obtains.
  letsencrypt:
  traefik-logs:

networks:
  default:
    name: neoams-network
