http:
  routers:
    api:
      rule: "PathPrefix(`/api/`) || PathPrefix(`/uploads/`) || PathPrefix(`/reference`)"
      service: api
    web:
      rule: "PathPrefix(`/`)"
      service: web
  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:3000"
        passHostHeader: true
    web:
      loadBalancer:
        servers:
          - url: "http://web:3000"
        passHostHeader: true
